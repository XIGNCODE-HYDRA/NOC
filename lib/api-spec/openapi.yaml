openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MikroTik NOC Bandwidth Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: devices
    description: MikroTik device management
  - name: interfaces
    description: Interface monitoring management
  - name: bandwidth
    description: Bandwidth statistics
  - name: netwatch
    description: MikroTik Netwatch monitoring
  - name: ping
    description: Ping / latency monitoring
  - name: dashboard
    description: Dashboard overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out successfully

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List all MikroTik devices
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Add a new MikroTik device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: Update a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Delete a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /devices/{id}/test:
    post:
      operationId: testDeviceConnection
      tags: [devices]
      summary: Test connection to a MikroTik device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"

  /devices/{id}/interfaces:
    get:
      operationId: listDeviceInterfaces
      tags: [devices]
      summary: Fetch available interfaces from a MikroTik device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Available interfaces on the device
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteInterface"

  /interfaces:
    get:
      operationId: listMonitoredInterfaces
      tags: [interfaces]
      summary: List all monitored interfaces
      responses:
        "200":
          description: Monitored interfaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonitoredInterface"
    post:
      operationId: addMonitoredInterface
      tags: [interfaces]
      summary: Add an interface to monitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoredInterfaceInput"
      responses:
        "201":
          description: Interface added to monitoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredInterface"

  /interfaces/{id}:
    patch:
      operationId: updateMonitoredInterface
      tags: [interfaces]
      summary: Update a monitored interface
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoredInterfaceUpdate"
      responses:
        "200":
          description: Updated monitored interface
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredInterface"
        "404":
          description: Not found
    delete:
      operationId: removeMonitoredInterface
      tags: [interfaces]
      summary: Remove an interface from monitoring
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /bandwidth/live:
    get:
      operationId: getLiveBandwidth
      tags: [bandwidth]
      summary: Get current live bandwidth for all monitored interfaces
      responses:
        "200":
          description: Live bandwidth readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BandwidthReading"

  /bandwidth/history:
    get:
      operationId: getBandwidthHistory
      tags: [bandwidth]
      summary: Get bandwidth history for a monitored interface
      parameters:
        - name: interfaceId
          in: query
          required: true
          schema:
            type: integer
        - name: minutes
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        "200":
          description: Bandwidth history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BandwidthHistory"

  /bandwidth/aggregate:
    get:
      operationId: getBandwidthAggregate
      tags: [bandwidth]
      summary: Get aggregated (bucketed) bandwidth for multi-timeframe graphs
      parameters:
        - name: interfaceId
          in: query
          required: true
          schema:
            type: integer
        - name: window
          in: query
          required: true
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
      responses:
        "200":
          description: Aggregated bandwidth data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BandwidthAggregate"

  /netwatch:
    get:
      operationId: listNetwatchEntries
      tags: [netwatch]
      summary: List all Netwatch entries
      responses:
        "200":
          description: List of Netwatch entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetwatchEntry"
    post:
      operationId: addNetwatchEntry
      tags: [netwatch]
      summary: Add a new Netwatch entry to a MikroTik device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetwatchEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetwatchEntry"

  /netwatch/live:
    get:
      operationId: getNetwatchLive
      tags: [netwatch]
      summary: Get live Netwatch status from in-memory cache
      responses:
        "200":
          description: Live Netwatch readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetwatchEntry"

  /netwatch/history:
    get:
      operationId: getNetwatchHistory
      tags: [netwatch]
      summary: Get Netwatch history for an entry
      parameters:
        - name: entryId
          in: query
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: Netwatch history with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetwatchHistoryResponse"

  /netwatch/sync/{deviceId}:
    post:
      operationId: syncNetwatchEntries
      tags: [netwatch]
      summary: Sync Netwatch entries from a MikroTik device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetwatchSyncResult"

  /netwatch/{id}:
    delete:
      operationId: deleteNetwatchEntry
      tags: [netwatch]
      summary: Delete a Netwatch entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ping/live:
    get:
      operationId: getPingLive
      tags: [ping]
      summary: Get current ping status for all devices
      responses:
        "200":
          description: Live ping readings per device
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PingReading"

  /ping/history:
    get:
      operationId: getPingHistory
      tags: [ping]
      summary: Get ping latency history for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: Ping history with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingHistoryResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/top-interfaces:
    get:
      operationId: getTopInterfaces
      tags: [dashboard]
      summary: Get top interfaces by bandwidth usage
      responses:
        "200":
          description: Top interfaces by usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopInterface"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    Device:
      type: object
      required: [id, name, host, port, username, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        status:
          type: string
          enum: [online, offline, unknown]
        lastSeen:
          type: ["string", "null"]
        createdAt:
          type: string

    DeviceInput:
      type: object
      required: [name, host, username, password]
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          default: 8728
        username:
          type: string
        password:
          type: string

    DeviceUpdate:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string

    ConnectionTestResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        routerOsVersion:
          type: ["string", "null"]
        identity:
          type: ["string", "null"]

    RemoteInterface:
      type: object
      required: [name, type, running]
      properties:
        name:
          type: string
        type:
          type: string
        running:
          type: boolean
        disabled:
          type: boolean
        comment:
          type: ["string", "null"]
        macAddress:
          type: ["string", "null"]

    MonitoredInterface:
      type: object
      required: [id, deviceId, deviceName, interfaceName, alias, enabled, createdAt]
      properties:
        id:
          type: integer
        deviceId:
          type: integer
        deviceName:
          type: string
        interfaceName:
          type: string
        alias:
          type: string
        enabled:
          type: boolean
        thresholdMbps:
          type: ["number", "null"]
        createdAt:
          type: string

    MonitoredInterfaceInput:
      type: object
      required: [deviceId, interfaceName, alias]
      properties:
        deviceId:
          type: integer
        interfaceName:
          type: string
        alias:
          type: string
        enabled:
          type: boolean
        thresholdMbps:
          type: ["number", "null"]

    MonitoredInterfaceUpdate:
      type: object
      properties:
        alias:
          type: string
        enabled:
          type: boolean
        thresholdMbps:
          type: ["number", "null"]

    BandwidthReading:
      type: object
      required: [interfaceId, interfaceName, alias, deviceName, rxBps, txBps, rxMbps, txMbps, timestamp]
      properties:
        interfaceId:
          type: integer
        interfaceName:
          type: string
        alias:
          type: string
        deviceName:
          type: string
        rxBps:
          type: number
        txBps:
          type: number
        rxMbps:
          type: number
        txMbps:
          type: number
        timestamp:
          type: string

    BandwidthHistory:
      type: object
      required: [timestamp, rxMbps, txMbps]
      properties:
        timestamp:
          type: string
        rxMbps:
          type: number
        txMbps:
          type: number

    BandwidthAggregate:
      type: object
      required: [timestamp, rxMbps, txMbps, maxRxMbps, maxTxMbps]
      properties:
        timestamp:
          type: string
        rxMbps:
          type: number
        txMbps:
          type: number
        maxRxMbps:
          type: number
        maxTxMbps:
          type: number

    PingReading:
      type: object
      required: [deviceId, deviceName, host, status, success]
      properties:
        deviceId:
          type: integer
        deviceName:
          type: string
        host:
          type: string
        status:
          type: string
        latencyMs:
          type: ["number", "null"]
        success:
          type: boolean
        timestamp:
          type: ["string", "null"]

    PingHistoryPoint:
      type: object
      required: [timestamp, success]
      properties:
        timestamp:
          type: string
        latencyMs:
          type: ["number", "null"]
        success:
          type: boolean

    PingStats:
      type: object
      required: [packetLoss]
      properties:
        minMs:
          type: ["number", "null"]
        maxMs:
          type: ["number", "null"]
        avgMs:
          type: ["number", "null"]
        packetLoss:
          type: number

    PingHistoryResponse:
      type: object
      required: [points, stats]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/PingHistoryPoint"
        stats:
          $ref: "#/components/schemas/PingStats"

    DashboardSummary:
      type: object
      required: [totalDevices, onlineDevices, totalInterfaces, activeInterfaces, totalRxMbps, totalTxMbps, alertCount]
      properties:
        totalDevices:
          type: integer
        onlineDevices:
          type: integer
        totalInterfaces:
          type: integer
        activeInterfaces:
          type: integer
        totalRxMbps:
          type: number
        totalTxMbps:
          type: number
        alertCount:
          type: integer

    TopInterface:
      type: object
      required: [interfaceId, alias, deviceName, rxMbps, txMbps, totalMbps]
      properties:
        interfaceId:
          type: integer
        alias:
          type: string
        deviceName:
          type: string
        rxMbps:
          type: number
        txMbps:
          type: number
        totalMbps:
          type: number

    NetwatchEntry:
      type: object
      required: [id, deviceId, deviceName, mikrotikId, host, interval, type, status]
      properties:
        id:
          type: integer
        deviceId:
          type: integer
        deviceName:
          type: string
        mikrotikId:
          type: string
        host:
          type: string
        name:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
        interval:
          type: string
        type:
          type: string
        status:
          type: string
        lastRttMs:
          type: ["number", "null"]
        rttMs:
          type: ["number", "null"]
        rttMinMs:
          type: ["number", "null"]
        rttMaxMs:
          type: ["number", "null"]
        lossPercent:
          type: number
        lastCheckedAt:
          type: ["string", "null"]

    NetwatchEntryInput:
      type: object
      required: [deviceId, host]
      properties:
        deviceId:
          type: integer
        host:
          type: string
        interval:
          type: string
          default: "00:00:10"
        type:
          type: string
          default: "icmp"
        comment:
          type: string

    NetwatchHistoryPoint:
      type: object
      required: [timestamp, status]
      properties:
        timestamp:
          type: string
        status:
          type: string
        rttMs:
          type: ["number", "null"]

    NetwatchStats:
      type: object
      required: [packetLoss]
      properties:
        minMs:
          type: ["number", "null"]
        maxMs:
          type: ["number", "null"]
        avgMs:
          type: ["number", "null"]
        packetLoss:
          type: number

    NetwatchHistoryResponse:
      type: object
      required: [points, stats]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/NetwatchHistoryPoint"
        stats:
          $ref: "#/components/schemas/NetwatchStats"

    NetwatchSyncResult:
      type: object
      required: [synced, added, updated]
      properties:
        synced:
          type: integer
        added:
          type: integer
        updated:
          type: integer
